---
# Proxy-specific Alloy log shipping. Alloy itself is installed by the common
# role's grafana_alloy.yaml (only when grafana_loki_token / grafana_tempo_token
# is set).

- name: Check Alloy is installed
  ansible.builtin.stat:
    path: /etc/alloy
  register: _alloy_dir

- name: Fail if Alloy is not installed
  ansible.builtin.fail:
    msg: >-
      proxy_enable_logs_export=true requires Alloy, but /etc/alloy is missing.
      Set grafana_loki_token (and/or grafana_tempo_token) in monitoring_secrets
      and re-run the common role on this host, or disable proxy_enable_logs_export.
  when: not _alloy_dir.stat.exists

# Certbot creates this directory as root:root 0700, preventing Alloy from
# reaching the readable log files inside. Certbot preserves an existing
# directory's permissions, so this also survives subsequent renewal runs.
- name: Allow Alloy to read the Certbot log directory
  ansible.builtin.file:
    path: /var/log/letsencrypt
    state: directory
    owner: root
    group: alloy
    mode: '0750'
  become: true
  when: proxy_ssl_enabled | bool
  notify: restart proxy alloy

- name: Deploy proxy alloy config
  ansible.builtin.template:
    src: proxy.alloy.j2
    dest: /etc/alloy/proxy.alloy
    owner: alloy
    group: alloy
    mode: '0644'
  become: true
  notify: restart proxy alloy
