- name: sovereign storage
  file:
    path: "{{ rollup_storage_dir }}"
    state: directory
    owner: sovereign
    group: sovereign
  become: true
  become_user: root

- name: sovereign per-database storage overrides
  file:
    path: "{{ lookup('vars', 'rollup_' ~ item, default='') }}"
    state: directory
    owner: sovereign
    group: sovereign
  become: true
  become_user: root
  loop: [live_db_path, ledger_db_path, user_nomt_db_path]
  when: lookup('vars', 'rollup_' ~ item, default='') | length > 0

- name: data availability storage
  file:
    path: "{{ da_store }}"
    state: directory
    owner: sovereign
    group: sovereign
  become: true
  become_user: root

- name: sovereign logs
  become: true
  become_user: root
  file:
    path: "{{ rollup_log_dir }}"
    state: directory
    owner: sovereign
    group: sovereign
  when: disk_config.logs_disk | default('') | length > 0

- name: snapshots directory
  become: true
  become_user: root
  file:
    path: "{{ snapshots_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
  when: disk_config.snapshots_disk | default('') | length > 0
