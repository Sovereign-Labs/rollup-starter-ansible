# Note: monitoring_secrets.yaml is loaded in load_vars.yaml during pre_tasks

- name: create directory for keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: download influxdata GPG key
  ansible.builtin.get_url:
    url: https://repos.influxdata.com/influxdata-archive_compat-exp2029.key
    dest: /etc/apt/keyrings/influxdata-archive_compat.key
    checksum: sha256:a721ad6e344dc8439df36ecf3e4130aeee4505dc78d83baf17a430231ac121b4
    mode: '0644'
  become: true
  register: influxdata_key

- name: add influxdata signing key to keyring
  ansible.builtin.shell: |
    cat /etc/apt/keyrings/influxdata-archive_compat.key | gpg --dearmor > /etc/apt/keyrings/influxdata-archive_compat.gpg
  become: true
  when: influxdata_key.changed

- name: add influxdata repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/influxdata-archive_compat.gpg] https://repos.influxdata.com/ubuntu stable main"
    state: present
    filename: influxdata
  become: true

- name: update apt cache
  ansible.builtin.apt:
    update_cache: yes
  become: true

- name: install pinned telegraf package
  ansible.builtin.apt:
    name: "telegraf={{ telegraf_version }}"
    state: present
  become: true
  notify: restart telegraf

- name: configure telegraf service
  ansible.builtin.template:
    src: telegraf.conf.j2
    dest: /etc/telegraf/telegraf.conf
    owner: telegraf
    group: telegraf
    mode: '0644'
  become: true
  notify: restart telegraf

- name: create telegraf.d directory for drop-in configs
  ansible.builtin.file:
    path: /etc/telegraf/telegraf.d
    state: directory
    owner: telegraf
    group: telegraf
    mode: '0755'
  become: true

- name: validate additional OTEL output settings
  ansible.builtin.assert:
    that:
      - otel_metrics_endpoint is match('^https?://[^\s]+$')
      - otel_token | length > 0
      - otel_service_name | length > 0
      - otel_service_instance_id | length > 0
    fail_msg: "An OTEL endpoint requires a token, service name, and instance ID."
  when: otel_metrics_endpoint | length > 0
  no_log: true

- name: configure additional OTEL metrics output
  ansible.builtin.template:
    src: telegraf-otel.conf.j2
    dest: /etc/telegraf/telegraf.d/otel.conf
    owner: root
    group: telegraf
    mode: '0640'
  when: otel_metrics_endpoint | length > 0
  become: true
  no_log: true
  diff: false
  notify: restart telegraf

- name: remove disabled OTEL metrics output
  ansible.builtin.file:
    path: /etc/telegraf/telegraf.d/otel.conf
    state: absent
  when: otel_metrics_endpoint | length == 0
  become: true
  notify: restart telegraf

- name: start and enable telegraf service
  systemd:
    name: telegraf
    state: started
    enabled: yes
  become: true
