#!/usr/sbin/nft -f
# Managed by ansible (roles/common). Loaded by nftables.service.
#
# This file owns the host's entire ruleset: `flush ruleset` wipes rules created
# by anything else on every reload. If another tool that manages firewall rules
# (docker, ufw, ...) is ever added, load this table from a dedicated unit instead.

flush ruleset

# Drop IPv4 packets carrying IP options (IHL != 5). Nothing legitimate sends
# them to these hosts, so reduce the attack surface.
table inet ipopts {
	chain input {
		type filter hook input priority -150; policy accept;
		ip hdrlength != 5 counter drop
	}
}
